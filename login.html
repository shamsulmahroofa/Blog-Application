<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BlogSpace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <section class="auth-visual">
        <a class="brand" href="index.html">
            <span class="brand-mark">B</span>
            BlogSpace
        </a>
        <div>
            <h1>Welcome back to your writing desk.</h1>
            <p>Pick up where you left off. Your drafts, published posts and ideas stay right here.</p>
        </div>
        <div class="auth-quote">
            <p>“A good blog doesn’t shout. It gives the reader room to think.”</p>
        </div>
    </section>

    <div class="auth-container">
        <form class="auth-form" id="loginForm">
            <h1>Welcome Back</h1>
            <p>Login to your BlogSpace account.</p>

            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@email.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>

            <p class="auth-switch">Don't have an account?
                <a href="register.html">Register here</a>
            </p>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
